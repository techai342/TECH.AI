<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Loading Redirect</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #071020;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(0,221,255,0.06), transparent 8%),
                  radial-gradient(1000px 400px at 90% 80%, rgba(255,58,217,0.05), transparent 8%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .glass-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 300px;
      height: 300px;
      border-radius: 30px;
      backdrop-filter: blur(25px) saturate(150%);
      -webkit-backdrop-filter: blur(25px) saturate(150%);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      opacity: 0;
      transform: scale(0.95);
      animation: fadeIn 0.8s ease forwards 1s; /* Start after 1s */
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid rgba(255, 255, 255, 0.9);
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h2 {
      color: white;
      font-weight: 500;
      font-size: 18px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="spinner"></div>
    <h2>Loading…</h2>
  </div>

  <script>
    // After 3 seconds, open the target link automatically
    setTimeout(() => {
      window.location.href = "https://tech-ai1.vercel.app/";
    }, 3000);
  </script>
</body>
</html>
